[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclediag"
version = "1.0.0"
description = "Standalone cycle / voltage-profile diagnosis engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cyclediag = "cyclediag.__main__:main"

[tool.setuptools]
package-dir = {"cyclediag" = "."}
packages = [
  "cyclediag",
  "cyclediag.analysis",
  "cyclediag.diagnosis",
  "cyclediag.diagnosis.halfcell",
  "cyclediag.features",
  "cyclediag.io",
  "cyclediag.models",
  "cyclediag.tools",
]

[tool.setuptools.package-data]
cyclediag = [
  "diagnosis/config/*.json",
  "planning/*.md",
  "specs/*.md",
]
