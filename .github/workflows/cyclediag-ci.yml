name: cyclediag-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cells:
        description: "Space-separated cell IDs (empty = Ch022 smoke)"
        required: false
        default: "M01Ch022"
      step:
        description: "Tagged-cycle stride around BPs"
        required: false
        default: "40"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e "./cyclediag[dev]"
      - name: Pytest
        run: python -m pytest cyclediag/tests -q --tb=short

  sohq-bp-presentation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e "./cyclediag[dev]"
      - name: Run SoHQ / BP presentation
        env:
          CELLS: ${{ github.event.inputs.cells || 'M01Ch022' }}
          STEP: ${{ github.event.inputs.step || '40' }}
        run: |
          python -m cyclediag.tools.run_sohq_bp_presentation \
            --cells ${CELLS} \
            --step ${STEP} \
            --out example/output/sohq_bp_presentation
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: sohq-bp-presentation
          path: example/output/sohq_bp_presentation/
          if-no-files-found: error
